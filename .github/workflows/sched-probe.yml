name: sched-probe

# 一次性实验：验证「全新路径的 workflow」能否被 GitHub scheduler 注册。
# 若本文件会触发、renew.yml 不会 → 是文件被卡住（换路径可救）。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "sched-probe fired at $(date -u)"
