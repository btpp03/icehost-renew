name: IceHost Renew + Keepalive

# 免费服有效期只有 24h，靠「DODAJ 6 GODZIN」每次 +6h 续。
# 有冷却（刚续过会报 "niedawno to zrobiłeś"）→ 所以我们**每 2 小时试一次**，
# 撞冷却算正常，能续就续，保证有效期一直往后顶。
# 手动触发：Actions 页 → Run workflow

on:
  schedule:
    - cron: '15 */2 * * *'      # UTC，每 2 小时一次（北京时间 :15）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icehost-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (playwright + chromium)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Check secrets
        env:
          ICEHOST_EMAIL: ${{ secrets.ICEHOST_EMAIL }}
          ICEHOST_PW: ${{ secrets.ICEHOST_PW }}
        run: |
          if [ -z "$ICEHOST_EMAIL" ] || [ -z "$ICEHOST_PW" ]; then
            echo "::error::缺少 Secrets: ICEHOST_EMAIL / ICEHOST_PW"; exit 1
          fi
          echo "✅ Secrets ok"

      - name: Run renew + keepalive
        env:
          ICEHOST_EMAIL: ${{ secrets.ICEHOST_EMAIL }}
          ICEHOST_PW: ${{ secrets.ICEHOST_PW }}
          ICEHOST_UUID: ${{ secrets.ICEHOST_UUID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TZ: Asia/Shanghai
          DEBUG: '1'
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" python3 renew_icehost.py
